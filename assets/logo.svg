<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="agroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#22c55e" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base Badge -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#0e1711" stroke="#233527" stroke-width="1.5"/>

  <!-- Deck Grid Slots (representing modular mod slots) -->
  <rect x="10" y="32" width="28" height="3" rx="1.5" fill="#1b2a1f"/>
  <rect x="10" y="37" width="20" height="3" rx="1.5" fill="#1b2a1f"/>

  <!-- Sprout & Precision Blade Icon -->
  <path d="M24 10 C24 10, 15 14, 15 22 C15 27 19 30 24 30 C29 30 33 27 33 22 C33 14 24 10 24 10 Z" 
        fill="url(#agroGrad)" 
        filter="url(#glow)"/>
        
  <!-- Leaf Central Vein (Modular Data Trace) -->
  <path d="M24 13 L24 28" stroke="#0e1711" stroke-width="2" stroke-linecap="round"/>
  <path d="M24 18 L20 15" stroke="#0e1711" stroke-width="1.75" stroke-linecap="round"/>
  <path d="M24 22 L28 19" stroke="#0e1711" stroke-width="1.75" stroke-linecap="round"/>

  <!-- Golden Grain Accent / Spark of Quality -->
  <circle cx="34" cy="14" r="2.5" fill="url(#goldGrad)"/>
</svg>
